<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 200 250" role="img" aria-label="Peg, the red peg that checks, waving"><style>
.peg{animation:bob 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:75px 236px}
.eyes{animation:blink 5.2s infinite;transform-box:view-box;transform-origin:77px 98px}
.wave{animation:wave 1.2s ease-in-out infinite;transform-box:view-box;transform-origin:128px 140px}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@media (prefers-reduced-motion:reduce){.peg,.sign,.spark,.drop,.eyes,.wave,.shadow{animation:none}.spark,.drop{opacity:0}}
</style><ellipse cx="75" cy="244" rx="58" ry="8" fill="#111010" fill-opacity="0.18"/><g class="peg"><rect x="18" y="20" width="114" height="216" rx="48" fill="#fb3a0e" stroke="#111010" stroke-width="7"/><rect x="38" y="44" width="16" height="150" rx="8" fill="#ffffff" fill-opacity="0.28"/><g class="eyes"><ellipse cx="60" cy="96" rx="9" ry="11" fill="#111010"/><ellipse cx="94" cy="96" rx="9" ry="11" fill="#111010"/></g><path d="M58 122 Q77 140 96 122" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><g class="wave"><path d="M128 140 Q154 132 158 100" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><circle cx="158" cy="92" r="10" fill="#fb3a0e" stroke="#111010" stroke-width="6"/></g><path d="M22 150 Q6 160 4 178" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><circle cx="4" cy="184" r="10" fill="#fb3a0e" stroke="#111010" stroke-width="6"/></g></svg>
