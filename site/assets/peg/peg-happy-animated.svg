<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 250" role="img" aria-label="Peg, the Hozu checker"><style>
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
.eyes{animation:blink 5.2s infinite;transform-origin:77px 96px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@media (prefers-reduced-motion:reduce){.bob,.eyes{animation:none}}
</style><ellipse cx="75" cy="244" rx="58" ry="8" fill="#111010" fill-opacity="0.18"/><g class="bob"><rect x="18" y="20" width="114" height="216" rx="48" fill="#fb3a0e" stroke="#111010" stroke-width="7"/><rect x="38" y="44" width="16" height="150" rx="8" fill="#ffffff" fill-opacity="0.28"/><g class="eyes"><ellipse cx="60" cy="92" rx="9" ry="11" fill="#111010"/><ellipse cx="94" cy="92" rx="9" ry="11" fill="#111010"/></g><path d="M58 120 Q77 138 96 120" fill="none" stroke="#111010" stroke-width="6" stroke-linecap="round"/></g></svg>
