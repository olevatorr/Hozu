<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -210 360 460" role="img" aria-label="Peg holds up a sign: OOPS!"><style>
.peg{animation:wobble 2s ease-in-out infinite;transform-box:view-box;transform-origin:75px 236px}
.drop{animation:drop 2s ease-in infinite;transform-box:fill-box}
@keyframes wobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg)}30%{transform:rotate(5deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(0)}}
@keyframes drop{0%,20%{opacity:0;transform:translateY(-6px)}35%{opacity:1}100%{opacity:0;transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){.peg,.sign,.spark,.drop,.eyes,.wave,.shadow{animation:none}.spark,.drop{opacity:0}}
