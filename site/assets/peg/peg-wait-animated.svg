<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -210 360 460" role="img" aria-label="Peg holds up a sign: WAIT."><style>
.peg{animation:stomp 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:75px 236px}
.sign{animation:wave 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:150px 128px}
@keyframes stomp{0%,40%,100%{transform:none}8%{transform:translateY(-10px)}16%{transform:scale(1.06,.94)}24%{transform:none}}
@keyframes wave{0%,40%,100%{transform:rotate(0)}6%{transform:rotate(-7deg)}14%{transform:rotate(6deg)}22%{transform:rotate(-4deg)}30%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.peg,.sign,.spark,.drop,.eyes,.wave,.shadow{animation:none}.spark,.drop{opacity:0}}
</style><ellipse cx="75" cy="244" rx="58" ry="8" fill="#111010" fill-opacity="0.18"/><g class="peg"><g class="sign"><rect x="146" y="-78" width="8" height="206" fill="#111010"/><rect x="83" y="-160" width="150" height="80" fill="#111010"/><rect x="75" y="-168" width="150" height="80" fill="#f1ede4" stroke="#111010" stroke-width="6"/><text x="150" y="-112" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="40" fill="#fb3a0e">WAIT.</text></g><rect x="18" y="20" width="114" height="216" rx="48" fill="#fb3a0e" stroke="#111010" stroke-width="7"/><rect x="38" y="44" width="16" height="150" rx="8" fill="#ffffff" fill-opacity="0.28"/><path d="M46 72 L70 82 M104 72 L80 82" stroke="#111010" stroke-width="7" stroke-linecap="round"/><ellipse cx="60" cy="100" rx="9" ry="11" fill="#111010"/><ellipse cx="94" cy="100" rx="9" ry="11" fill="#111010"/><path d="M62 132 L92 132" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><path d="M126 150 Q146 158 150 134" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><circle cx="150" cy="128" r="10" fill="#fb3a0e" stroke="#111010" stroke-width="6"/><path d="M24 150 Q4 148 -2 128" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><circle cx="-4" cy="122" r="10" fill="#fb3a0e" stroke="#111010" stroke-width="6"/></g></svg>
