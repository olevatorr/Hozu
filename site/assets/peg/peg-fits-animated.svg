<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -260 360 510" role="img" aria-label="Peg holds up a sign: FITS!"><style>
.peg{animation:hop 1.6s cubic-bezier(.3,0,.3,1) infinite;transform-box:view-box;transform-origin:75px 236px}
.sign{animation:cheer 1.6s ease-in-out infinite;transform-box:view-box;transform-origin:150px 128px}
.spark{animation:spark 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.s2{animation-delay:.25s}.s3{animation-delay:.5s}
.shadow{animation:shadow 1.6s cubic-bezier(.3,0,.3,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes hop{0%,100%{transform:scale(1.08,.92)}12%{transform:none}35%{transform:translateY(-26px) scale(.96,1.05)}60%{transform:none}70%{transform:scale(1.06,.94)}80%{transform:none}}
@keyframes cheer{0%,60%,100%{transform:rotate(0)}35%{transform:rotate(8deg)}}
@keyframes spark{0%{opacity:0;transform:scale(0) rotate(0)}30%{opacity:1;transform:scale(1) rotate(45deg)}70%,100%{opacity:0;transform:scale(.2) rotate(90deg)}}
@keyframes shadow{0%,12%,60%,100%{transform:none}35%{transform:scale(.7);opacity:.6}}
@media (prefers-reduced-motion:reduce){.peg,.sign,.spark,.drop,.eyes,.wave,.shadow{animation:none}.spark,.drop{opacity:0}}
</style><ellipse class="shadow" cx="75" cy="244" rx="58" ry="8" fill="#111010" fill-opacity="0.18"/><path class="spark" d="M30 -110 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#fb3a0e" stroke="#111010" stroke-width="3"/><path class="spark s2" d="M222 -40 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#2fa36b" stroke="#111010" stroke-width="3"/><path class="spark s3" d="M-20 20 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#f1ede4" stroke="#111010" stroke-width="3"/><g class="peg"><g class="sign"><rect x="146" y="-78" width="8" height="206" fill="#111010"/><rect x="83" y="-160" width="150" height="80" fill="#111010"/><rect x="75" y="-168" width="150" height="80" fill="#f1ede4" stroke="#111010" stroke-width="6"/><text x="150" y="-112" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="40" fill="#fb3a0e">FITS!</text></g><rect x="18" y="20" width="114" height="216" rx="48" fill="#fb3a0e" stroke="#111010" stroke-width="7"/><rect x="38" y="44" width="16" height="150" rx="8" fill="#ffffff" fill-opacity="0.28"/><path d="M50 100 Q60 86 70 100 M84 100 Q94 86 104 100" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><path d="M54 120 Q77 150 100 120 Z" fill="#111010" stroke="#111010" stroke-width="5" stroke-linejoin="round"/><path d="M126 150 Q146 158 150 134" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><circle cx="150" cy="128" r="10" fill="#fb3a0e" stroke="#111010" stroke-width="6"/><path d="M24 150 Q2 140 -6 112" fill="none" stroke="#111010" stroke-width="7" stroke-linecap="round"/><circle cx="-8" cy="106" r="10" fill="#fb3a0e" stroke="#111010" stroke-width="6"/></g></svg>
